<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Artimo Counter – Sčitatel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js" defer></script>
<style>
/* ===================== DESIGN TOKENS ===================== */
:root{
  --bg:#05072b;
  --glass:rgba(255,255,255,.05);--glass2:rgba(255,255,255,.08);--glass3:rgba(255,255,255,.13);
  --stroke:rgba(255,255,255,.08);--stroke2:rgba(255,255,255,.14);
  --text:#f4f5fb;--text2:rgba(232,235,255,.62);--text3:rgba(232,235,255,.38);
  --accent:#f5d3a8;--ink:#05072b;--blue:#5b8cff;--green:#34c759;--red:#ff5a5f;--orange:#ff9f0a;--gray:#8e8e93;
  --shadow:0 10px 30px rgba(0,0,0,.35);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Inter,Roboto,"Helvetica Neue",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font);font-size:13px;color:var(--text);background:radial-gradient(1200px 700px at 0% -20%,#111766 0%,transparent 60%),radial-gradient(900px 600px at 110% 120%,#0d1250 0%,transparent 60%),var(--bg);background-attachment:fixed;min-height:100vh;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:13px;color:inherit}
::selection{background:rgba(91,140,255,.4)}
*{scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.14) transparent}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:8px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.22);background-clip:padding-box;border:2px solid transparent}
::-webkit-scrollbar-corner{background:transparent}
.logo{height:30px;width:auto;display:block}
.jchip{height:30px;padding:0 10px 0 4px;border-radius:15px;display:inline-flex;align-items:center;gap:6px}
.jchip i{font-style:normal;width:22px;height:22px;border-radius:11px;background:rgba(255,255,255,.12);display:inline-flex;align-items:center;justify-content:center;font-weight:700;color:var(--text)}
.chip.on.jchip i{background:rgba(255,255,255,.25)}
.issues{margin-top:12px;font-size:12px;line-height:1.5}
.issues .it{padding:7px 9px;border-radius:8px;background:rgba(255,90,95,.1);border:1px solid rgba(255,90,95,.3);margin-top:6px}
.issues .ok{padding:7px 9px;border-radius:8px;background:rgba(52,199,89,.08);border:1px solid rgba(52,199,89,.3);margin-top:6px}
.issues .ed{padding:7px 9px;border-radius:8px;background:rgba(255,159,10,.08);border:1px solid rgba(255,159,10,.35);margin-top:6px}
.stale{opacity:.55}

/* ---- ovládací prvky (jednotný jazyk) ---- */
.btn{height:30px;padding:0 12px;border-radius:8px;border:none;background:var(--glass2);color:var(--text);font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;transition:background .15s,transform .1s,opacity .15s}
.btn:hover:not(:disabled){background:var(--glass3)}
.btn:active:not(:disabled){transform:scale(.98)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary{background:var(--accent);color:var(--ink)}
.btn.primary:hover:not(:disabled){background:#f9dfbd}
.btn.blue{background:var(--blue);color:#fff}
.btn.danger{background:rgba(255,90,95,.14);color:#ff8a8d}
.btn.plain{background:transparent;color:var(--blue);padding:0 6px}
.btn.plain:hover:not(:disabled){background:rgba(91,140,255,.12)}
.btn.lg{height:38px;padding:0 18px;font-size:14px;border-radius:10px}
.btn.sm{height:24px;padding:0 8px;font-size:12px;border-radius:6px}
.btn.icon{width:30px;padding:0}
.btn.full{width:100%}
input.in,select.in,textarea.in{height:30px;width:100%;padding:0 10px;border-radius:8px;border:1px solid transparent;background:rgba(255,255,255,.06);outline:none;transition:border-color .15s,box-shadow .15s}
textarea.in{height:auto;padding:8px 10px;resize:vertical}
.in:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(91,140,255,.25)}
.in::placeholder{color:var(--text3)}
select.in option{background:#11154a}
.seg{display:inline-flex;background:rgba(255,255,255,.07);border-radius:9px;padding:2px;gap:2px}
.seg button{height:26px;padding:0 12px;border-radius:7px;border:none;background:transparent;color:var(--text2);font-weight:600;cursor:pointer;transition:background .15s,color .15s}
.seg button.on{background:rgba(255,255,255,.17);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.35)}
.seg.lg button{height:30px;padding:0 16px;font-size:13px}
.switch{position:relative;display:inline-block;width:36px;height:22px;flex:0 0 auto}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;border-radius:11px;background:rgba(120,120,128,.36);transition:background .2s;cursor:pointer}
.switch span::after{content:"";position:absolute;left:2px;top:2px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.3);transition:transform .2s}
.switch input:checked+span{background:var(--green)}
.switch input:checked+span::after{transform:translateX(14px)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{height:24px;padding:0 10px;border-radius:12px;border:none;background:var(--glass2);color:var(--text2);font-size:12px;font-weight:600;cursor:pointer}
.chip.on{background:var(--blue);color:#fff}
.badge{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:10px;font-size:11px;font-weight:600;white-space:nowrap}
.badge.open{background:rgba(52,199,89,.16);color:#5fe08a}
.badge.locked{background:rgba(255,159,10,.16);color:#ffb84d}
.badge.evaluated{background:rgba(245,211,168,.18);color:var(--accent)}
.badge.ready{background:rgba(255,255,255,.08);color:var(--text2)}
.badge.done{background:var(--accent);color:var(--ink)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--gray);display:inline-block;flex:0 0 auto}
.dot.ok{background:var(--green)}.dot.wait{background:var(--orange)}.dot.bad{background:var(--red)}
.muted{color:var(--text2)}.faint{color:var(--text3)}
.hint{font-size:12px;color:var(--text2);line-height:1.45;margin-top:4px}
.err{color:#ff8a8d;font-size:12px;margin-top:6px}
.lbl{display:block;font-size:12px;color:var(--text2);margin:10px 0 4px;font-weight:500}
.row{display:flex;gap:8px;align-items:center}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.sp{flex:1}

/* ---- rozvržení ---- */
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:18px;padding:10px 20px;background:rgba(5,7,43,.72);backdrop-filter:saturate(160%) blur(20px);-webkit-backdrop-filter:saturate(160%) blur(20px);border-bottom:1px solid var(--stroke)}
.brand{font-family:"Outfit",var(--font);font-weight:900;font-size:17px;letter-spacing:.02em;line-height:1}
.brand span{color:var(--accent)}
.brand small{display:block;font-family:var(--font);font-size:11px;font-weight:500;color:var(--text2);letter-spacing:0;margin-top:3px}
.conn{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text2)}
.badge-n{background:var(--red);color:#fff;border-radius:8px;font-size:10px;padding:1px 6px;margin-left:4px}
.layout{display:grid;grid-template-columns:300px 1fr;gap:18px;padding:18px 20px;max-width:1600px;margin:0 auto}
@media(max-width:980px){.layout{grid-template-columns:1fr}}
.card{background:var(--glass);border:1px solid var(--stroke);border-radius:14px;box-shadow:var(--shadow);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.card.pad{padding:18px}
.page{display:none}.page.on{display:grid}

/* ---- postranní panel ---- */
.side{display:flex;flex-direction:column;gap:10px;align-self:start;position:sticky;top:70px;max-height:calc(100vh - 88px);overflow:auto;padding-bottom:6px}
.sect{background:var(--glass);border:1px solid var(--stroke);border-radius:12px;box-shadow:0 4px 16px rgba(0,0,0,.2)}
.sect>summary{list-style:none;display:flex;align-items:center;gap:8px;padding:11px 14px;cursor:pointer;font-weight:600;font-size:13px;user-select:none}
.sect>summary::-webkit-details-marker{display:none}
.sect>summary::after{content:"";width:7px;height:7px;border-right:1.6px solid var(--text3);border-bottom:1.6px solid var(--text3);transform:rotate(-45deg);margin-left:auto;transition:transform .2s}
.sect[open]>summary::after{transform:rotate(45deg)}
.sect>summary .cnt{color:var(--text3);font-weight:500}
.sect-body{padding:0 14px 14px}
.set-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--stroke)}
.set-row:first-child{border-top:none}
.set-row .t{flex:1;line-height:1.3}
.set-row .t small{display:block;color:var(--text3);font-size:11px}
.cat-item{padding:9px 10px;border-radius:9px;cursor:pointer;margin:0 -4px;transition:background .15s}
.cat-item:hover{background:var(--glass2)}
.cat-item.sel{background:rgba(91,140,255,.18)}
.cat-item .nm{font-weight:600;display:flex;align-items:center;gap:6px}
.cat-item .mt{font-size:11px;color:var(--text3);margin-top:2px}
.rd-item{display:flex;align-items:center;gap:8px;padding:6px 10px 6px 18px;border-radius:8px;cursor:pointer;color:var(--text2);margin:0 -4px}
.rd-item:hover{background:var(--glass2);color:var(--text)}
.rd-item.sel{background:rgba(91,140,255,.18);color:var(--text)}
.jrow{display:flex;align-items:center;gap:6px;padding:4px 0}
.jl{width:26px;height:26px;border-radius:7px;background:var(--glass2);display:inline-flex;align-items:center;justify-content:center;font-weight:700;flex:0 0 auto}
.qrlog{font-size:12px;margin-top:8px;display:flex;flex-direction:column;gap:4px}
.qrlog div{padding:6px 8px;border-radius:7px;background:var(--glass)}

/* ---- hlavní panel ---- */
.main{min-width:0;display:flex;flex-direction:column;gap:18px}
.head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.head h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.01em}
.head h1 .faint{font-weight:500}
.meta{color:var(--text2);margin-top:4px;font-size:13px}
.sec-t{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;margin:20px 0 8px}
.big{font-size:28px;font-weight:700;letter-spacing:-.02em}
.big small{font-size:13px;color:var(--text2);font-weight:500;letter-spacing:0}
.empty{color:var(--text2);text-align:center;padding:60px 20px;line-height:1.6}
.jcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.jcard{display:flex;gap:10px;align-items:center;padding:10px;border-radius:10px;background:var(--glass);border:1px solid var(--stroke)}
.jcard.ready{border-color:rgba(52,199,89,.55);background:rgba(52,199,89,.07)}
.jcard.ready .jl{background:var(--green);color:#04210d}
.jcard .info{font-size:11px;color:var(--text2);line-height:1.45;min-width:0}
.jcard .info b{color:var(--text);font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:11px;font-weight:600;color:var(--text3);text-align:center;padding:6px;border-bottom:1px solid var(--stroke2)}
.tbl td{text-align:center;padding:6px;border-bottom:1px solid var(--stroke)}
.tbl tr:last-child td{border-bottom:none}
.tbl td.l,.tbl th.l{text-align:left}
.tbl .cell{cursor:pointer;border-radius:6px;font-size:12px}
.tbl .cell.ok{color:#5fe08a}
.tbl .cell.none{color:var(--text3)}
.tbl .cell.sel{background:rgba(91,140,255,.2)}
.tag{display:inline-block;font-size:9px;font-weight:700;padding:1px 4px;border-radius:4px;background:var(--glass3);color:var(--text2);margin-left:3px;vertical-align:1px}
.tag.qr{background:rgba(91,140,255,.25);color:#9db8ff}
.tag.ed{background:rgba(255,159,10,.22);color:#ffb84d}
.detail{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--glass);font-size:13px;line-height:1.6;min-height:40px}
.groups{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.group{padding:6px 10px;border-radius:8px;background:var(--glass);font-size:12px}
.group b{color:var(--accent);margin-right:4px}
.rounds{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.rcard{padding:12px;border-radius:10px;background:var(--glass);border:1px solid var(--stroke);cursor:pointer;transition:border-color .15s}
.rcard:hover{border-color:var(--stroke2)}
.rcard b{display:block;font-size:14px;margin-bottom:4px}
.plan{margin-top:14px;padding:14px;border-radius:12px;background:rgba(245,211,168,.07);border:1px solid rgba(245,211,168,.22)}
.warn{padding:10px 12px;border-radius:10px;background:rgba(255,90,95,.1);border:1px solid rgba(255,90,95,.35);line-height:1.5;margin-top:10px}
.okbox{padding:10px 12px;border-radius:10px;background:rgba(52,199,89,.08);border:1px solid rgba(52,199,89,.35);margin-top:10px}
.infobox{padding:10px 12px;border-radius:10px;background:var(--glass);margin-top:10px;line-height:1.5}

/* ---- vyhodnocení ---- */
.xtab td{padding:4px 3px;font-size:13px}
.xtab td.x{color:var(--accent);font-weight:700;width:24px}
.xtab td.x.ed{cursor:pointer}
.xtab td.x.ed:hover{background:rgba(91,140,255,.18)}
.xtab td.cpl{font-weight:700;font-size:15px;width:56px;border-radius:6px}
.xtab td.sum{font-weight:700;font-size:15px}
.xtab th.d{color:var(--accent);border-left:1px solid var(--stroke2)}
.xtab td.dl{border-left:1px solid var(--stroke2)}
.xtab tr.q td.cpl{background:var(--accent);color:var(--ink)}
.xtab tr.q td{background:rgba(245,211,168,.05)}
.xtab tr.cut td{border-bottom:2px solid var(--accent)}
.xtab tr.tie td{background:rgba(255,90,95,.08)}
.ctrl{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.stepper{display:inline-flex;align-items:center;background:rgba(255,255,255,.07);border-radius:9px;padding:2px}
.stepper button{width:30px;height:28px;border:none;background:transparent;color:var(--text);font-size:16px;cursor:pointer;border-radius:7px}
.stepper button:hover{background:var(--glass3)}
.stepper input{width:48px;height:28px;text-align:center;border:none;background:transparent;font-size:15px;font-weight:700;outline:none}
.podium{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.pod{border-radius:12px;padding:12px;text-align:center;background:var(--glass);border:1px solid var(--stroke)}
.pod .pl{font-size:12px;font-weight:600;color:var(--text2)}
.pod .cn{font-size:34px;font-weight:700;line-height:1.15;letter-spacing:-.02em}
.pod.p1{background:var(--accent);color:var(--ink);border-color:var(--accent)}
.pod.p1 .pl{color:var(--ink)}
.pod.p2{border-color:#d9dce8}.pod.p3{border-color:#e3ad85}
.sk td{font-size:12px;padding:5px 3px}
.sk td.cpl{font-weight:700;font-size:14px}
.sk td.dec{background:var(--accent);color:var(--ink);font-weight:700;border-radius:5px}
.sk td.place{font-weight:700;font-size:14px;color:var(--accent)}
.sk td.mk{color:var(--text3)}
.sk th.cols{color:var(--text3)}
.sk th.bad{color:#ff8a8d}
.sk small{font-size:10px;opacity:.7}
.mk-in{width:34px;height:24px;text-align:center;border-radius:6px;border:1px solid transparent;background:rgba(255,255,255,.08);color:var(--text);font-weight:600;outline:none}
.mk-in:focus{border-color:var(--blue)}
.mk-in.bad{border-color:var(--red);background:rgba(255,90,95,.15)}
.dance-h{display:flex;align-items:center;gap:8px;margin:22px 0 6px}
.dance-h h3{margin:0;font-size:15px}
.legend{font-size:11px;color:var(--text3);margin-top:8px;line-height:1.5}

/* ---- modální okno ---- */
.backdrop{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:20px;animation:fade .15s}
.modal{width:min(560px,100%);max-height:90vh;overflow:auto;background:#151a52;border:1px solid var(--stroke2);border-radius:16px;box-shadow:0 30px 80px rgba(0,0,0,.5);animation:pop .18s}
.modal .mh{padding:16px 18px 6px;font-size:16px;font-weight:700}
.modal .mb{padding:0 18px 6px}
.modal .mf{display:flex;gap:8px;justify-content:flex-end;padding:14px 18px;border-top:1px solid var(--stroke);margin-top:12px}
@keyframes fade{from{opacity:0}}@keyframes pop{from{opacity:0;transform:scale(.97)}}
.qrbox{display:flex;justify-content:center;padding:10px;background:#fff;border-radius:12px;margin:8px auto;width:fit-content}

@media print{
  body{background:#fff;color:#000;font-size:11px}
  header,.side,.no-print{display:none!important}
  .layout{display:block;padding:0}
  .card{background:#fff;border:none;box-shadow:none;backdrop-filter:none}
  .tbl th,.tbl td{border-color:#bbb;color:#000}
  .sk td.dec,.pod.p1,.xtab tr.q td.cpl{background:#ddd!important;color:#000!important}
  .muted,.faint,.legend,.meta{color:#333}
}
</style>
</head>

// ===== SKATING SYSTEM ČSTS v5 (port referenční implementace z PDF) =====
// marks[t][j][i] = pořadí, které rozhodčí j dal páru i v tanci t.
// Počítá s dvojnásobky míst, aby dělená místa zůstala celočíselná.
function skatingFinal(marks) {
  const T = marks.length;
  if (!T || !marks[0].length) throw new Error("Chybí tance nebo rozhodčí");
  const X = marks[0].length, N = marks[0][0].length;
  if (N < 2) throw new Error("Musí být alespoň dva páry");
  for (const dance of marks) {
    if (dance.length !== X) throw new Error("Počet rozhodčích se liší");
    for (const judge of dance) {
      const s = [...judge].sort((a, b) => a - b);
      if (judge.length !== N || s.some((v, i) => v !== i + 1)) throw new Error("Každý rozhodčí musí zadat permutaci 1..N");
    }
  }
  const count = (m, k) => m.reduce((a, v) => a + (v <= k ? 1 : 0), 0);
  const total = (m, k) => m.reduce((a, v) => a + (v <= k ? v : 0), 0);

  function order(group, data, k) {
    if (group.length <= 1 || k > N) return [group];
    const buckets = new Map();
    for (const i of group) {
      const key = [-count(data[i], k), total(data[i], k)];
      const ks = key.join(",");
      if (!buckets.has(ks)) buckets.set(ks, { key, items: [] });
      buckets.get(ks).items.push(i);
    }
    const sorted = [...buckets.values()].sort((a, b) => a.key[0] - b.key[0] || a.key[1] - b.key[1]);
    const out = [];
    for (const b of sorted) out.push(...order(b.items, data, k + 1));
    return out;
  }

  function danceResult(dance) {
    const data = Array.from({ length: N }, (_, i) => dance.map(j => j[i]));
    const majority = Math.floor(X / 2) + 1;
    const result2 = new Array(N).fill(null), col = new Array(N).fill(null);
    const remaining = new Set(Array.from({ length: N }, (_, i) => i));
    let r = 1, k = 1;
    while (remaining.size) {
      while (k <= N && ![...remaining].some(i => count(data[i], k) >= majority)) k++;
      if (k > N) throw new Error("Nenalezena většina v tanci");
      const eligible = [...remaining].filter(i => count(data[i], k) >= majority);
      for (const g of order(eligible, data, k)) {
        for (const i of g) { result2[i] = 2 * r + g.length - 1; col[i] = k; }
        g.forEach(i => remaining.delete(i));
        r += g.length;
      }
      k++; // v5: další sloupec, NE k = r
    }
    return { result2, col, data, majority };
  }

  const danceRes = marks.map(danceResult);
  const dance2 = danceRes.map(d => d.result2);
  const sums2 = Array.from({ length: N }, (_, i) => dance2.reduce((a, d) => a + d[i], 0));
  const allMarks = Array.from({ length: N }, (_, i) => {
    const out = []; for (let t = 0; t < T; t++) for (let j = 0; j < X; j++) out.push(marks[t][j][i]); return out;
  });
  const final2 = new Array(N).fill(null), rule = new Array(N).fill(null);

  function rule10(group, r) {
    group = [...group];
    while (group.length) {
      if (group.length === 1) { final2[group[0]] = 2 * r; rule[group[0]] ??= "10"; return; }
      const keys = new Map();
      for (const i of group) {
        const q = []; for (let t = 0; t < T; t++) if (dance2[t][i] <= 2 * r) q.push(dance2[t][i]);
        keys.set(i, [-q.length, q.reduce((a, v) => a + v, 0)]);
      }
      const best = [...keys.values()].sort((a, b) => a[0] - b[0] || a[1] - b[1])[0];
      const isBest = i => keys.get(i)[0] === best[0] && keys.get(i)[1] === best[1];
      const B = group.filter(isBest), Z = group.filter(i => !isBest(i));
      if (B.length === 1) { final2[B[0]] = 2 * r; rule[B[0]] ??= "10"; r += 1; }
      else { rule11(B, r); r += B.length; }
      group = Z;
    }
  }

  function rule11(group, r) {
    const majority = Math.floor(X * T / 2) + 1;
    let k = r;
    while (k <= N && !group.some(i => count(allMarks[i], k) >= majority)) k++;
    if (k > N) throw new Error("Nenalezena většina v pravidle 11");
    const eligible = group.filter(i => count(allMarks[i], k) >= majority);
    const W = order(eligible, allMarks, k)[0];
    for (const i of W) { final2[i] = 2 * r + W.length - 1; rule[i] = "11"; }
    const rest = group.filter(i => !W.includes(i));
    if (rest.length) rule10(rest, r + W.length);
  }

  const grouped = new Map();
  sums2.forEach((s, i) => { if (!grouped.has(s)) grouped.set(s, []); grouped.get(s).push(i); });
  let r = 1;
  for (const s of [...grouped.keys()].sort((a, b) => a - b)) {
    const g = grouped.get(s);
    if (g.length === 1) rule[g[0]] = "9";
    rule10(g, r);
    r += g.length;
  }

  return {
    byDance: dance2.map(d => d.map(v => v / 2)),
    decidedCol: danceRes.map(d => d.col),
    sums: sums2.map(v => v / 2),
    overall: final2.map(v => v / 2),
    rule,
    majority: Math.floor(X / 2) + 1
  };
}

function parseCouples(str) {
  const out = new Set();
  for (const part of String(str).split(/[,;\s]+/).filter(Boolean)) {
    const m = part.match(/^(\d+)-(\d+)$/);
    if (m) { const a = +m[1], b = +m[2]; for (let i = Math.min(a, b); i <= Math.max(a, b); i++) out.add(i); }
    else if (/^\d+$/.test(part)) out.add(+part);
    else throw new Error(`Neplatné číslo páru: „${part}“`);
  }
  return [...out].sort((a, b) => a - b);
}
// zkrácený zápis 1-12, 15, 20-24
function fmtCouples(list) {
  const s = [...list].sort((a, b) => a - b), out = [];
  for (let i = 0; i < s.length; i++) { let j = i; while (j + 1 < s.length && s[j + 1] === s[j] + 1) j++; out.push(j - i >= 2 ? `${s[i]}-${s[j]}` : j > i ? `${s[i]}, ${s[j]}` : `${s[i]}`); i = j; }
  return out.join(", ");
}
function splitGroups(couples, g) {
  const s = [...couples].sort((a, b) => a - b), n = s.length; g = Math.max(1, Math.min(g, n));
  const base = Math.floor(n / g), extra = n % g, out = []; let k = 0;
  for (let i = 0; i < g; i++) { const size = base + (i < extra ? 1 : 0); out.push({ n: i + 1, couples: s.slice(k, k + size) }); k += size; }
  return out;
}
function placeLabels(places) {
  const cnt = new Map(); places.forEach(p => cnt.set(p, (cnt.get(p) || 0) + 1));
  return places.map(p => { const g = cnt.get(p); if (g === 1) return `${p}.`; const from = p - (g - 1) / 2; return `${from}.–${from + g - 1}.`; });
}
function download(name, data) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: "application/json" }));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
}
function plain(v) {
  if (v == null || typeof v !== "object") return v;
  if (v.toMillis) return v.toMillis();
  if (Array.isArray(v)) return v.map(plain);
  return Object.fromEntries(Object.entries(v).map(([k, x]) => [k, plain(x)]));
}

function modal(title, bodyHtml, buttons) {
  return new Promise(resolve => {
    const root = $("modalRoot");
    root.innerHTML = `<div class="backdrop"><div class="modal"><div class="mh">${title}</div><div class="mb">${bodyHtml}</div>
      <div class="mf">${buttons.map((b, i) => `<button class="btn ${b.cls || ""}" data-i="${i}">${b.label}</button>`).join("")}</div></div></div>`;
    const close = v => { root.innerHTML = ""; resolve(v); };
    root.querySelector(".backdrop").addEventListener("mousedown", e => { if (e.target.classList.contains("backdrop")) close(null); });
    root.querySelectorAll("[data-i]").forEach(btn => btn.onclick = async () => {
      const b = buttons[+btn.dataset.i];
      if (b.action) { try { const res = await b.action(root); if (res === false) return; close(res ?? b.value ?? true); } catch (e) { const er = root.querySelector(".merr"); if (er) er.textContent = e.message; } }
      else close(b.value ?? null);
    });
    setTimeout(() => root.querySelector("input.in")?.focus(), 30);
  });
}

    cats = new Map(snap.docs.map(d => [d.id, { id: d.id, ...d.data() }])); renderAll();
  }));
  unsubs.push(onSnapshot(collection(db, "competitions", comp, "rounds"), { includeMetadataChanges: true }, snap => {
    setConn(snap.metadata.fromCache ? "wait" : "ok", snap.metadata.fromCache ? "Offline / připojování" : "Připojeno");
    rounds = new Map(snap.docs.map(d => [d.id, { id: d.id, ...d.data() }])); renderAll();
  }, err => { setConn("bad", "Chyba: " + err.code); log("CHYBA čtení kol: " + err.message); }));

function watchRunSheets(rid) {
  unsubRun?.(); runSheets.clear();
  if (!rid) return;
  unsubRun = onSnapshot(collection(db, "competitions", comp, "rounds", rid, "sheets"), snap => {
    runSheets = new Map(snap.docs.map(d => [d.id, d.data()]));
    for (const ch of snap.docChanges()) {
      const s = ch.doc.data(), key = rid + ch.doc.id, prev = knownRevs.get(key);
      if (ch.type !== "removed" && prev !== s.rev) {
        knownRevs.set(key, s.rev);
        if (prev !== undefined || !snap.metadata.fromCache) {
          const sent = tsMs(s.sentAt), delay = sent && s.clientAt ? ((sent - s.clientAt) / 1000).toFixed(1) + " s" : "?";
          log(`Porotce ${s.judge} · ${DANCES[s.dance]} · v${s.rev}${s.source === "qr" ? " (QR)" : ""} · ${delay}`);
        }
      }
    }
    if (page === "run") renderRunMain();
  });
}

function qrSvg(text, size = 220) {
  if (!window.qrcode) return `<div class="err">Knihovna QR se nenačetla (chybí internet?).</div>`;
  const qr = window.qrcode(0, "M"); qr.addData(text); qr.make();
  const n = qr.getModuleCount(), cell = size / (n + 8);
  let path = "";
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (qr.isDark(r, c)) path += `M${(c + 4) * cell},${(r + 4) * cell}h${cell}v${cell}h-${cell}z`;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><rect width="100%" height="100%" fill="#fff"/><path d="${path}" fill="#000" shape-rendering="crispEdges"/></svg>`;
}

  const url = judgeUrl(j);
  modal(`Porotce ${j}${compDoc.jury?.[j] ? ` · ${esc(compDoc.jury[j])}` : ""}`,

}

$("importFile").onchange = async e => {

  try { data = JSON.parse(await f.text()); if (data.format !== "artimo-counter/soutez") throw 0; }
  catch { alertBox("Soubor není export soutěže z Artimo Counter."); return; }
  const id = data.competition.id;
  const existing = await getDoc(doc(db, "competitions", id));
  const exRounds = await getDocs(collection(db, "competitions", id, "rounds"));
  const exCats = await getDocs(collection(db, "competitions", id, "categories"));
  const hasData = existing.exists() || exRounds.docs.length || exCats.docs.length;
  const ok = await confirmBox(`Načíst soutěž <b>${esc(data.competition.name || id)}</b> (ID ${esc(id)}): ${data.categories.length} kategorií, ${data.rounds.length} kol.` +
    (hasData ? `<br><br><b style="color:#ff8a8d">Soutěž s tímto ID už v databázi je. Její data budou nahrazena obsahem souboru.</b>` : ""), "Načíst", hasData ? "danger" : "primary");
  if (!ok) return;
  try {
    for (const r of exRounds.docs) {
      const sh = await getDocs(collection(db, "competitions", id, "rounds", r.id, "sheets"));
      for (const s of sh.docs) await deleteDoc(doc(db, "competitions", id, "rounds", r.id, "sheets", s.id));
      await deleteDoc(doc(db, "competitions", id, "rounds", r.id));
    }
    for (const c of exCats.docs) await deleteDoc(doc(db, "competitions", id, "categories", c.id));
    const { id: _, ...compData } = data.competition;
    await setDoc(doc(db, "competitions", id), compData);
    for (const c of data.categories) { const { id: cid, ...cd } = c; await setDoc(doc(db, "competitions", id, "categories", cid), cd); }
    for (const r of data.rounds) {
      const { id: rid, sheets, ...rd } = r;

      for (const s of sheets || []) { const { id: sid, ...sd } = s; await setDoc(doc(db, "competitions", id, "rounds", rid, "sheets", sid), sd); }
    }
    comp = id; startComp(); log(`Import soutěže ${id} dokončen`);

};

function editCategory(cid) {
  if (!compExists) { alertBox("Nejdřív založte soutěž (Nová soutěž…) nebo ji načtěte importem."); return; }
  const c = cid ? cats.get(cid) : { name: "", dances: LAT, couples: [], key: [], groups: 1, judges: [] };

  const buttons = [{ label: "Zrušit" }];
  if (cid && !hasRounds) buttons.unshift({ label: "Smazat", cls: "danger", action: async () => {
    if (!await confirmBox(`Smazat kategorii ${esc(c.name)}?`, "Smazat", "danger")) return false;
    await deleteDoc(doc(db, "competitions", comp, "categories", cid)); selCat = null;
  } });
  buttons.push({ label: cid ? "Uložit" : "Přidat", cls: "primary", action: async root => {
    const name = root.querySelector("#cName").value.trim();
    const dances = Object.keys(DANCES).filter(d => chipVals(root, "dance").includes(d));
    const couples = parseCouples(root.querySelector("#cCouples").value);
    const keyStr = root.querySelector("#cKey").value.trim();
    const key = keyStr ? keyStr.split(/[,;\s–-]+/).filter(Boolean).map(x => { const n = parseInt(x, 10); if (!(n > 0)) throw new Error(`Neplatné číslo v klíči: „${x}“`); return n; }) : [];
    const groups = parseInt(segVal(root, "groups"), 10) || 1;
    const judges = chipVals(root, "judge");
    if (!name) throw new Error("Vyplňte název kategorie.");
    if (!dances.length) throw new Error("Vyberte alespoň jeden tanec.");
    if (couples.length < 2) throw new Error("Zadejte alespoň 2 páry.");
    for (let i = 1; i < key.length; i++) if (key[i] >= key[i - 1]) throw new Error("Postupový klíč musí klesat (např. 24, 12, 6).");
    if (key.length && key[0] >= couples.length) throw new Error(`První číslo klíče (${key[0]}) musí být menší než počet párů (${couples.length}).`);
    if (!judges.length) throw new Error("Vyberte porotce, kteří kategorii hodnotí.");
    const id = cid || nextId();
    await setDoc(doc(db, "competitions", comp, "categories", id), { name, dances, couples, key, groups, judges, created: c.created || Date.now(), order: c.order ?? cats.size });

    <label class="lbl">Postupový klíč</label><input class="in" id="cKey" value="${esc((c.key || []).join(", "))}" placeholder="např. 24, 12, 6">
    <div class="hint">Kolik párů postoupí z každého kola. Poslední číslo = počet finalistů. Prázdné = rovnou finále.</div>
    <label class="lbl">Skupiny v postupových kolech</label>${segHtml("groups", [[1, "Bez skupin"], [2, "2 skupiny"], [3, "3 skupiny"], [4, "4 skupiny"]], c.groups || 1)}
    <label class="lbl">Porota kategorie</label>${judgeChipsHtml(c.judges || [])}

    <div class="merr err"></div>`, buttons).then(() => renderAll());

// plán dalšího kola podle postupového klíče
function planNext(cat) {
  const rs = roundsOfCat(cat.id), last = rs[rs.length - 1];
  if (last && last.type === "final") return { blocked: last.status === "evaluated" ? "Kategorie je dokončená." : "Finále probíhá." };
  if (last && last.status !== "evaluated") return { blocked: `Nejdřív vyhodnoťte kolo „${last.label}“.` };
  const couples = last ? (last.qualified || []) : cat.couples;
  const key = cat.key || [];
  let ki = last ? (last.keyIndex ?? -1) + 1 : 0;
  while (ki < key.length && key[ki] >= couples.length) ki++;
  const isFinal = ki >= key.length;
  const label = isFinal ? "Finále" : (ki === key.length - 1 && rs.length > 0 ? "Semifinále" : `${rs.length + 1}. kolo`);
  const groups = isFinal ? 1 : Math.min(cat.groups || 1, Math.max(1, Math.floor(couples.length / 4)));
  return { couples, keyIndex: isFinal ? key.length : ki, type: isFinal ? "final" : "prelim", required: isFinal ? null : key[ki], label, groups, dances: cat.dances, judges: cat.judges };
}

function sheetText(r, s) {
  if (!s) return `<span class="faint">Lístek zatím nedorazil.</span>`;
  const head = `<b>Porotce ${s.judge} · ${DANCES[s.dance]}</b> <span class="faint">· verze ${s.rev} · ${fmtTimeS(tsMs(s.sentAt))}${s.source === "qr" ? " · QR" : ""}${s.edited ? " · upraveno sčitatelem" : ""}</span><br>`;
  if (r.type === "prelim") return head + `Křížky (${s.marks.length}): <b>${s.marks.join(", ")}</b>`;
  return head + Object.entries(s.placings).sort((a, b) => a[1] - b[1]).map(([c, p]) => `${p}. <b>${c}</b>`).join(" &nbsp;·&nbsp; ");
}

$("qrUploadBtn").onclick = () => $("qrFiles").click();
$("qrFiles").onchange = async e => {
  const files = [...e.target.files]; e.target.value = "";
  if (!files.length) return;

  for (const f of files) {

    try { const text = await decodeQrFile(f); row.innerHTML = `${esc(f.name)}: ${await applyQrPayload(text)}`; }
    catch (err) { row.innerHTML = `${esc(f.name)}: <span style="color:#ff8a8d">${esc(err.message)}</span>`; }
  }
};
let jsqrPromise = null;
function loadJsQR() {
  if (window.jsQR) return Promise.resolve();
  return jsqrPromise ??= new Promise((res, rej) => { const s = document.createElement("script"); s.src = JSQR_URL; s.onload = res; s.onerror = () => rej(new Error("Nepodařilo se načíst čtečku QR (chybí internet?).")); document.head.appendChild(s); });
}
async function decodeQrFile(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error("Soubor není obrázek.")); i.src = url; });
    if ("BarcodeDetector" in window) {
      try { const det = new BarcodeDetector({ formats: ["qr_code"] }); const r = await det.detect(img); if (r[0]?.rawValue) return r[0].rawValue; } catch {}
    }
    await loadJsQR();
    for (const max of [1600, 1000, 2400, 700]) {
      const scale = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const w = Math.round(img.naturalWidth * scale), h = Math.round(img.naturalHeight * scale);
      const cv = document.createElement("canvas"); cv.width = w; cv.height = h;
      const ctx = cv.getContext("2d", { willReadFrequently: true }); ctx.drawImage(img, 0, 0, w, h);
      const res = window.jsQR(ctx.getImageData(0, 0, w, h).data, w, h, { inversionAttempts: "attemptBoth" });
      if (res?.data) return res.data;
    }
    throw new Error("QR kód se v obrázku nepodařilo najít. Zkuste ostřejší fotku.");
  } finally { URL.revokeObjectURL(url); }
}
// formát: AC2;c=<soutěž>;r=<kolo>;j=<porotce>;t=p|f;ts=<ms>;S=1.4.7;C=...
async function applyQrPayload(text) {
  const parts = text.split(";");
  if (parts[0] !== "AC2") throw new Error("Není to QR kód z aplikace porotce.");
  const kv = Object.fromEntries(parts.slice(1).map(p => { const i = p.indexOf("="); return [p.slice(0, i), p.slice(i + 1)]; }));
  if (kv.c !== comp) throw new Error(`QR patří k soutěži „${kv.c}“, otevřená je „${comp}“.`);
  const r = rounds.get(kv.r); if (!r) throw new Error("Kolo z QR kódu v soutěži neexistuje.");
  if (!r.judges.includes(kv.j)) throw new Error(`Porotce ${kv.j} v kole „${r.label}“ nehodnotí.`);
  if (r.status === "evaluated") throw new Error(`Kolo „${r.label}“ je už vyhodnocené.`);
  const existing = await getDocs(collection(db, "competitions", comp, "rounds", r.id, "sheets"));
  const ex = new Map(existing.docs.map(d => [d.id, d.data()]));
  let written = 0, same = 0;
  for (const d of r.dances) {
    if (kv[d] == null) continue;
    const nums = kv[d] ? kv[d].split(".").map(Number) : [];
    if (nums.some(n => !r.couples.includes(n))) throw new Error(`Neplatné číslo páru v tanci ${DANCES[d]}.`);
    const prev = ex.get(`${d}_${kv.j}`);
    const data = { judge: kv.j, dance: d, type: r.type, uid: null, clientAt: +kv.ts || Date.now(), sentAt: serverTimestamp(), source: "qr", rev: (prev?.rev || 0) + 1 };
    if (r.type === "prelim") data.marks = [...nums].sort((a, b) => a - b);
    else data.placings = Object.fromEntries(nums.map((c, i) => [String(c), i + 1]));
    const sameAsPrev = prev && (r.type === "prelim" ? JSON.stringify(prev.marks) === JSON.stringify(data.marks) : JSON.stringify(Object.entries(prev.placings).sort()) === JSON.stringify(Object.entries(data.placings).sort()));
    if (sameAsPrev) { same++; continue; }
    await setDoc(sheetRef(r.id, d, kv.j), data); written++;
  }
  log(`QR: porotce ${kv.j} · ${titleOf(r)} · zapsáno ${written}, beze změny ${same}`);
  return `<b>${kv.j}</b> · ${esc(titleOf(r))} – zapsáno ${written}${same ? `, beze změny ${same}` : ""} ✓`;
}

      ${r.status === "evaluated" ? `<button class="btn no-print" data-act="unEval">Upravit znovu</button>` : ""}
      <button class="btn no-print" data-act="print">Tisk</button></div>
    <div class="meta">${r.type === "final" ? "Finále" : `Postupové kolo · porotci dávali ${r.required} křížků`} · ${pary(r.couples.length)} · porota ${r.judges.map(j => compDoc.jury?.[j] ? `${j} (${esc(compDoc.jury[j])})` : j).join(", ")}${r.evaluatedAt ? ` · vyhodnoceno ${fmtDT(r.evaluatedAt)}` : ""}</div>
    ${r.type === "prelim" ? prelimView(r) : finalView(r)}`;
  const issues = r.type === "prelim" ? prelimData(r).issues : finalData(r).issues;
  $("evalIssues").innerHTML = (r.status === "open" ? `<div class="ed">Kolo ještě probíhá – lístky se průběžně doplňují.</div>` : "")
    + (editMode ? `<div class="ed"><b>Ruční úpravy zapnuté.</b><br>${r.type === "prelim" ? "Kliknutím do tabulky přidáte nebo odeberete křížek." : "Přepište umístění v tabulce tance (Tab = další buňka)."} Změny se ukládají hned, lístek se označí ✎.</div>` : "")
    + (issues.length ? `<div class="sec-t" style="margin:14px 0 0">Kontrola lístků</div>` + issues.map(i => `<div class="it">${i}</div>`).join("") : `<div class="ok">✓ Všechny lístky jsou v pořádku</div>`);
  if (focusKey) { const inp = el.querySelector(`[data-edit="${focusKey}"]`); if (inp) { inp.focus(); try { inp.setSelectionRange(selStart, selStart); } catch {} } }
  window.scrollTo(0, scrollY);
}

// ----- postupové kolo -----
function prelimData(r) {
  const crosses = {}, totals = {}, issues = [];
  for (const c of r.couples) { crosses[c] = {}; totals[c] = 0; for (const d of r.dances) crosses[c][d] = new Set(); }
  for (const d of r.dances) for (const j of r.judges) {
    const s = evalSheets.get(`${d}_${j}`);
    if (!s) { issues.push(`${j} · ${DANCES[d]}: chybí lístek`); continue; }
    if (s.marks.length !== r.required) issues.push(`${j} · ${DANCES[d]}: ${s.marks.length} křížků místo ${r.required}`);
    for (const c of s.marks) if (crosses[c]) { crosses[c][d].add(j); totals[c]++; }
  }
  return { crosses, totals, issues };
}
function prelimCut(r, t, n) {
  const sorted = [...r.couples].sort((a, b) => t[b] - t[a] || a - b);
  n = Math.max(1, Math.min(n, sorted.length));
  const v = t[sorted[n - 1]], next = sorted[n] !== undefined ? t[sorted[n]] : null;
  return { sorted, n, tie: next !== null && next === v, down: sorted.filter(c => t[c] > v).length, up: sorted.filter(c => t[c] >= v).length, value: v };
}
function prelimView(r) {
  const { crosses, totals, issues } = prelimData(r);
  const n = advanceDraft.get(r.id) ?? r.qualified?.length ?? r.required;
  const cut = prelimCut(r, totals, n);
  const qualified = new Set(cut.tie ? cut.sorted.slice(0, cut.down) : cut.sorted.slice(0, cut.n));
  const tieSet = new Set(cut.tie ? cut.sorted.filter(c => totals[c] === cut.value) : []);
  const evaluated = r.status === "evaluated";
  const groupOf = {}; (r.groups || []).forEach(g => g.couples.forEach(c => groupOf[c] = g.n));
  const multiG = (r.groups || []).length > 1;
  const edited = new Set([...evalSheets.values()].filter(s => s.edited || s.source === "manual").map(s => `${s.dance}_${s.judge}`));

  let box = "";
  if (evaluated) box = `<div class="okbox">✓ Postupuje <b>${pary(r.qualified.length)}</b>: ${fmtCouples(r.qualified)}</div>`;
  else if (cut.tie) box = `<div class="warn"><b>Shoda na hranici postupu.</b> Páry ${[...tieSet].join(", ")} mají shodně ${cut.value} křížků. Kolik párů postoupí?
      <div class="row" style="margin-top:8px">${cut.down > 0 ? `<button class="btn" data-n="${cut.down}">${pary(cut.down)} (bez shodných)</button>` : ""}<button class="btn" data-n="${cut.up}">${pary(cut.up)} (včetně shodných)</button></div></div>`;

  return `
    <div class="ctrl no-print" style="margin-top:14px">
      ${evaluated ? "" : `<div><div class="lbl" style="margin-top:0">Postupuje párů</div><div class="stepper"><button data-step="-1">−</button><input id="advN" value="${cut.n}"><button data-step="1">+</button></div></div>`}
      <div class="row wrap">
        ${evaluated ? `<button class="btn primary" data-act="nextRound">Spustit další kolo →</button><button class="btn" data-act="dlQual">Stáhnout postupující</button>`
          : `<button class="btn primary" data-act="saveQual" ${cut.tie ? "disabled" : ""}>Potvrdit postup ${cut.tie ? "" : `(${cut.n})`}</button>`}
      </div>
    </div>
    ${box}
    <div style="overflow-x:auto;margin-top:12px"><table class="tbl xtab">
      <tr><th>#</th><th>Pár</th>${multiG ? "<th>Sk.</th>" : ""}${r.dances.map(d => `<th class="d" colspan="${r.judges.length}">${DANCES[d]}</th>`).join("")}<th>Σ</th><th></th></tr>
      <tr><th></th><th></th>${multiG ? "<th></th>" : ""}${r.dances.map(d => r.judges.map((j, i) => `<th class="${i === 0 ? "d" : ""}" style="${i === 0 ? "" : "border-left:none"}">${j}${edited.has(`${d}_${j}`) ? '<span class="tag ed">✎</span>' : ""}</th>`).join("")).join("")}<th></th><th></th></tr>
      ${cut.sorted.map((c, i) => {
        const q = evaluated ? r.qualified.includes(c) : qualified.has(c), isCut = !evaluated && !cut.tie && i === cut.n - 1;
        return `<tr class="${q ? "q" : ""} ${isCut ? "cut" : ""} ${tieSet.has(c) && !evaluated ? "tie" : ""}"><td class="faint">${i + 1}</td><td class="cpl">${c}</td>${multiG ? `<td class="faint">${groupOf[c] || ""}</td>` : ""}
          ${r.dances.map(d => r.judges.map((j, k) => `<td class="x ${editMode ? "ed" : ""} ${k === 0 ? "dl" : ""}" ${editMode ? `data-tog="${c}|${d}|${j}"` : ""}>${crosses[c][d].has(j) ? "✕" : ""}</td>`).join("")).join("")}
          <td class="sum">${totals[c]}</td><td>${q ? "✓" : tieSet.has(c) && !evaluated ? "?" : ""}</td></tr>`;
      }).join("")}
    </table></div>`;
}

// ----- finále -----
function finalData(r) {
  const marks = {}, issues = [], badCols = new Set();
  for (const d of r.dances) {
    marks[d] = {}; for (const c of r.couples) marks[d][c] = [];
    for (const j of r.judges) {
      const s = evalSheets.get(`${d}_${j}`);
      const vals = r.couples.map(c => s?.placings?.[String(c)] ?? null);
      r.couples.forEach((c, i) => marks[d][c].push(vals[i]));
      if (!s) { issues.push(`${j} · ${DANCES[d]}: chybí lístek`); badCols.add(`${d}_${j}`); continue; }
      const sorted = vals.filter(v => v != null).sort((a, b) => a - b);
      if (sorted.length !== r.couples.length || sorted.some((v, i) => v !== i + 1)) { issues.push(`${j} · ${DANCES[d]}: pořadí není 1–${r.couples.length} bez opakování`); badCols.add(`${d}_${j}`); }
    }
  }
  let sk = null, stale = false;
  if (!issues.length) { try { sk = skatingFinal(r.dances.map(d => r.judges.map((_, j) => r.couples.map(c => marks[d][c][j])))); } catch (e) { issues.push(e.message); } }
  if (sk) lastSk.set(r.id, sk); else if (lastSk.has(r.id)) { sk = lastSk.get(r.id); stale = true; }
  return { marks, issues, badCols, sk, stale };
}
function finalView(r) {
  const { marks, issues, badCols, sk, stale } = finalData(r);
  const N = r.couples.length, evaluated = r.status === "evaluated";
  const edited = new Set([...evalSheets.values()].filter(s => s.edited || s.source === "manual").map(s => `${s.dance}_${s.judge}`));
  let html = "";
  if (!sk) html += `<div class="infobox">Výsledek zatím nelze spočítat – chyby jsou vypsané vlevo.</div>`;
  if (sk) {
    const labels = placeLabels(sk.overall);
    const order = r.couples.map((c, i) => ({ c, i, p: sk.overall[i], l: labels[i] })).sort((a, b) => a.p - b.p || a.c - b.c);
    const pc = p => p === 1 ? "p1" : p > 1 && p <= 2.5 ? "p2" : p > 2 && p <= 3.5 ? "p3" : "";
    html += `<div class="row no-print" style="margin-top:14px">${evaluated ? `<div class="okbox" style="margin:0;flex:1">✓ Výsledky potvrzeny ${fmtDT(r.evaluatedAt)}</div>` : `<button class="btn primary" data-act="confirmFinal" ${stale ? "disabled" : ""}>Potvrdit výsledky finále</button>${stale ? `<span class="muted">Zobrazen poslední platný výsledek – opravte chyby vlevo.</span>` : ""}`}</div>
      <div class="${stale ? "stale" : ""}"><div class="sec-t">Výsledky</div>
      <div class="podium">${order.map(o => `<div class="pod ${pc(o.p)}"><div class="pl">${o.l} místo</div><div class="cn">${o.c}</div></div>`).join("")}</div>
      <div class="sec-t">Celkové pořadí</div>
      <table class="tbl sk"><tr><th>Pár</th>${r.dances.map(d => `<th>${DANCES[d]}</th>`).join("")}<th>Součet</th><th>Rozhodlo</th><th>Místo</th></tr>
      ${order.map(o => `<tr><td class="cpl">${o.c}</td>${r.dances.map((d, t) => `<td>${fmtNum(sk.byDance[t][o.i])}</td>`).join("")}<td><b>${fmtNum(sk.sums[o.i])}</b></td>
        <td class="mk">${{ "9": "", "10": "pravidlo 10", "11": "pravidlo 11" }[sk.rule[o.i]] ?? ""}</td><td class="place">${o.l}</td></tr>`).join("")}</table>
      <div class="legend">Pravidlo 9: nižší součet umístění. Pravidlo 10: při shodě rozhoduje počet tanců s umístěním na hledané místo nebo lepší, pak jejich součet. Pravidlo 11: spojené známky ze všech tanců.</div></div>`;
  }
  r.dances.forEach((d, t) => {
    const pl = sk ? placeLabels(sk.byDance[t]) : null;
    const ord = r.couples.map((c, i) => ({ c, i })).sort((a, b) => sk && !editMode ? sk.byDance[t][a.i] - sk.byDance[t][b.i] || a.c - b.c : a.c - b.c);
    html += `<div class="dance-h"><h3>${DANCES[d]}</h3></div><div style="overflow-x:auto"><table class="tbl sk">
      <tr><th>Pár</th>${r.judges.map(j => `<th class="${badCols.has(`${d}_${j}`) ? "bad" : ""}">${j}${edited.has(`${d}_${j}`) ? '<span class="tag ed">✎</span>' : ""}</th>`).join("")}
        ${sk ? Array.from({ length: N }, (_, k) => `<th class="cols">${k === 0 ? "1" : "1–" + (k + 1)}</th>`).join("") + "<th>Místo</th>" : ""}</tr>
      ${ord.map(({ c, i }) => {
        const m = marks[d][c];
        const cells = r.judges.map((j, k) => editMode
          ? `<td><input class="mk-in ${badCols.has(`${d}_${j}`) ? "bad" : ""}" data-edit="${c}|${d}|${j}" value="${m[k] ?? ""}" inputmode="numeric"></td>`
          : `<td>${m[k] ?? "–"}</td>`).join("");
        let skc = "";
        if (sk) {
          const dec = sk.decidedCol[t][i];
          skc = Array.from({ length: N }, (_, k) => { const col = k + 1; if (col > dec) return `<td></td>`;
            const cnt = m.filter(v => v != null && v <= col).length, sum = m.filter(v => v != null && v <= col).reduce((a, v) => a + v, 0);
            return `<td class="${col === dec ? "dec" : "mk"} ${stale ? "stale" : ""}">${cnt >= sk.majority ? `${cnt}<small> (${sum})</small>` : cnt || "–"}</td>`; }).join("") + `<td class="place">${pl[i]}</td>`;
        }
        return `<tr><td class="cpl">${c}</td>${cells}${skc}</tr>`;
      }).join("")}
    </table></div>`;
  });
  if (sk) html += `<div class="legend">Většina = ${sk.majority} z ${r.judges.length} rozhodčích. Ve sloupci „1–k“ je počet známek k a lepších, v závorce jejich součet. Zvýrazněná buňka rozhodla o umístění.</div>`;
  return html;
}

// ----- ruční úpravy -----
async function writeEdited(r, d, j, patch) {
  const prev = evalSheets.get(`${d}_${j}`);
  const base = prev || { judge: j, dance: d, type: r.type, uid: null, clientAt: Date.now(), sentAt: serverTimestamp(), source: "manual", rev: 0 };
  if (r.type === "prelim" && !base.marks) base.marks = [];
  if (r.type === "final" && !base.placings) base.placings = {};
  await setDoc(sheetRef(r.id, d, j), { ...base, ...patch, edited: true, editedAt: Date.now(), rev: (base.rev || 0) + 1 });
}
$("evalMain").addEventListener("change", async e => {
  if (e.target.id === "editSw") { editMode = e.target.checked; renderEvalMain(); return; }
  const ed = e.target.dataset.edit; if (!ed) return;
  const r = rounds.get(evalRid); const [c, d, j] = ed.split("|");
  const prev = evalSheets.get(`${d}_${j}`);
  const placings = { ...(prev?.placings || {}) };
  const v = parseInt(e.target.value, 10);
  if (v > 0) placings[c] = v; else delete placings[c];
  await writeEdited(r, d, j, { placings });
});
$("evalMain").addEventListener("input", e => {
  if (e.target.id === "advN") { const v = parseInt(e.target.value, 10); if (v > 0) { advanceDraft.set(evalRid, v); renderEvalMain(); } }
});
$("evalMain").addEventListener("click", async e => {
  const r = rounds.get(evalRid); if (!r) return;
  const tog = e.target.closest("[data-tog]")?.dataset.tog;
  if (tog) {
    const [c, d, j] = tog.split("|"); const prev = evalSheets.get(`${d}_${j}`);
    const set = new Set(prev?.marks || []); const n = +c; set.has(n) ? set.delete(n) : set.add(n);
    await writeEdited(r, d, j, { marks: [...set].sort((a, b) => a - b) }); return;
  }
  const step = e.target.closest("[data-step]")?.dataset.step;
  if (step) { const { totals } = prelimData(r); const cur = advanceDraft.get(r.id) ?? r.required; advanceDraft.set(r.id, Math.max(1, Math.min(r.couples.length, prelimCut(r, totals, cur).n + +step))); renderEvalMain(); return; }
  const n = e.target.closest("[data-n]")?.dataset.n; if (n) { advanceDraft.set(r.id, +n); renderEvalMain(); return; }
  const act = e.target.closest("[data-act]")?.dataset.act; if (!act) return;
  if (act === "print") window.print();
  if (act === "unEval") {
    if (!await confirmBox("Vrátit kolo do stavu před vyhodnocením? Potvrzený postup nebo výsledky se zruší.", "Upravit znovu")) return;
    await updateDoc(roundRef(r.id), { status: "locked", evaluatedAt: null, qualified: null, result: null });
  }
  if (act === "saveQual") {
    const { totals, issues } = prelimData(r);
    if (issues.length && !await confirmBox(`Kontrola lístků hlásí ${issues.length} problémů. Přesto potvrdit postup?`, "Potvrdit")) return;
    const cut = prelimCut(r, totals, advanceDraft.get(r.id) ?? r.required);
    if (cut.tie) return;
    const qualified = cut.sorted.slice(0, cut.n).sort((a, b) => a - b);
    await updateDoc(roundRef(r.id), { qualified, status: "evaluated", evaluatedAt: Date.now(), lockedAt: r.lockedAt || Date.now(),
      result: { kind: "prelim", totals: Object.fromEntries(r.couples.map(c => [c, totals[c]])) } });
    advanceDraft.delete(r.id); editMode = false;
    log(`Postup potvrzen: ${titleOf(r)} – ${qualified.length} párů`);
  }
  if (act === "dlQual") download(`postup_${slug(r.category || "kategorie")}_${slug(r.label)}.json`,
    { format: "artimo-counter/postup", version: 2, competition: comp, category: r.category, fromRound: r.label, couples: r.qualified, createdAt: new Date().toISOString() });
  if (act === "nextRound") { const c = cats.get(r.categoryId); if (c) startRoundModal(c); else alertBox("Kolo nepatří k žádné kategorii."); }
  if (act === "confirmFinal") {
    const { sk } = finalData(r); if (!sk) return;
    await updateDoc(roundRef(r.id), { status: "evaluated", evaluatedAt: Date.now(), lockedAt: r.lockedAt || Date.now(),
      result: { kind: "final", overall: Object.fromEntries(r.couples.map((c, i) => [c, sk.overall[i]])), rule: Object.fromEntries(r.couples.map((c, i) => [c, sk.rule[i]])) } });
    editMode = false; log(`Výsledky finále potvrzeny: ${titleOf(r)}`);
  }
});

// ===================== PŘIPOJENÍ =====================
function setConn(cls, text) { $("connDot").className = "dot " + cls; $("connText").textContent = text; }
let started = false;
onAuthStateChanged(auth, user => { if (user && !started) { started = true; startComp(); } });
signInAnonymously(auth).catch(e => { setConn("bad", "Přihlášení selhalo"); log("CHYBA přihlášení: " + e.code); });
</script>
</body>
